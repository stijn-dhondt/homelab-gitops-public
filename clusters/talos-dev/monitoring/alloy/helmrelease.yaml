apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 5m
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: alloy
      version: "1.14.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  values:
    alloy:
      # Pod log collector replacing Promtail (EOL). The pipeline below is a 1:1 port of the
      # promtail 6.17.1 chart's default "kubernetes-pods" scrape job, so streams in Loki keep
      # the same labels (namespace, pod, container, app, instance, component, job, node_name,
      # filename, stream) and existing Grafana queries/dashboards keep working.
      configMap:
        content: |
          // Only this node's pods; every DaemonSet pod tails its own node's /var/log/pods.
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("HOSTNAME")
            }
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_pod_controller_name"]
              regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
              action        = "replace"
              target_label  = "__tmp_controller_name"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_name",
                "__meta_kubernetes_pod_label_app",
                "__tmp_controller_name",
                "__meta_kubernetes_pod_name",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              action       = "replace"
              target_label = "app"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_instance",
                "__meta_kubernetes_pod_label_instance",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              action       = "replace"
              target_label = "instance"
            }
            rule {
              source_labels = [
                "__meta_kubernetes_pod_label_app_kubernetes_io_component",
                "__meta_kubernetes_pod_label_component",
              ]
              regex        = "^;*([^;]+)(;.*)?$"
              action       = "replace"
              target_label = "component"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              action        = "replace"
              target_label  = "node_name"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              action        = "replace"
              target_label  = "namespace"
            }
            rule {
              source_labels = ["namespace", "app"]
              separator     = "/"
              replacement   = "$1"
              action        = "replace"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              action        = "replace"
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              action        = "replace"
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              replacement   = "/var/log/pods/*$1/*.log"
              action        = "replace"
              target_label  = "__path__"
            }
            // Static (mirror) pods such as the Talos control plane log under their config hash.
            rule {
              source_labels = [
                "__meta_kubernetes_pod_annotationpresent_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_annotation_kubernetes_io_config_hash",
                "__meta_kubernetes_pod_container_name",
              ]
              separator    = "/"
              regex        = "true/(.*)"
              replacement  = "/var/log/pods/*$1/*.log"
              action       = "replace"
              target_label = "__path__"
            }
          }

          local.file_match "pods" {
            path_targets = discovery.relabel.pods.output
          }

          loki.source.file "pods" {
            targets    = local.file_match.pods.targets
            forward_to = [loki.process.pods.receiver]
          }

          loki.process "pods" {
            stage.cri {}
            forward_to = [loki.write.loki.receiver]
          }

          loki.write "loki" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

      # Tail positions live on the host (like Promtail's /run/promtail) so a pod restart
      # resumes where it left off instead of re-sending every log file from the start.
      storagePath: /var/lib/alloy
      mounts:
        varlog: true
        extra:
          - name: storage
            mountPath: /var/lib/alloy

    controller:
      type: daemonset
      # Collect from the control-plane nodes too, same as Promtail did.
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      volumes:
        extra:
          - name: storage
            hostPath:
              path: /var/lib/alloy
              type: DirectoryOrCreate
