apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Flux's reconciliation entry point for this cluster (see flux-system/gotk-sync.yaml's
# spec.path). Plain Kustomize resource list - no dependsOn/ordering here, so anything that
# needs to wait on CRDs existing first becomes its own separate Flux Kustomization instead
# (see networking/cert-manager-issuers-kustomization.yaml).
resources:
  # networking
  - networking/cilium
  - networking/ingress-nginx
  - networking/cert-manager
  - networking/cert-manager-issuers-kustomization.yaml
  - networking/cloudflare-tunnel
  # storage
  - storage/democratic-csi
  - storage/longhorn
  # secrets
  - security/sealed-secrets
  # apps - see apps/README.md for the per-app file convention
  - apps/wordpress
  - apps/n8n
  - apps/authentik
  - apps/jumphost
  # monitoring
  - monitoring/namespace
  - monitoring/kube-prometheus-stack
  - monitoring/metrics-server
  - monitoring/loki
  - monitoring/promtail
