# Lives in the sealed-secrets namespace (not cluster-backup) - it grants access *into* that
# namespace, not out of this one. Read-only, and only Secrets - least privilege for exporting the
# sealed-secrets controller's own signing key(s).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-backup-secret-reader
  namespace: sealed-secrets
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
