apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 5m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  values:
    defaultSettings:
      defaultDataPath: /var/lib/longhorn
      replicaAutoBalance: best-effort
      # Without this, a volume with no running workload (e.g. cluster-backup-data between its
      # 01:00 CronJob run and the 02:00 nightly-backup RecurringJob) sits detached, and the
      # RecurringJob silently skips it instead of attaching it to back it up. See issue #15.
      allowRecurringJobWhileVolumeDetached: true
    defaultBackupStore: 
      backupTarget: "nfs://10.0.50.100:/Longhorn"
      backupTargetCredentialSecret: ""
      pollInterval: 300  
    persistence:
      defaultClass: false   # keep democratic-csi as default; set true if you want Longhorn default instead
    csi:
      attacherReplicaCount: 3
      provisionerReplicaCount: 3
