apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single-replica
  # Not a Helm-templated class (unlike the chart's own "longhorn" default) - a plain
  # StorageClass pointing at the same CSI provisioner, for volumes where losing a node
  # means losing the volume is an accepted tradeoff (e.g. Prometheus TSDB, backed up
  # nightly to the NAS - see clusters/talos-dev/monitoring/kube-prometheus-stack).
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  # best-effort (not strict-local!) - tried strict-local live on 2026-09-12 and it caused
  # an outage: it HARD-REQUIRES the replica and the attaching node to match, and refuses to
  # attach otherwise instead of relocating the replica, so a pod rescheduled to a different
  # node than its existing replica just fails to start. best-effort still prefers a local
  # replica (avoiding the network hop) but falls back to remote instead of blocking attach.
  #
  # Caveat: best-effort tries to build that local replica whenever the pod lands on a node
  # without one, and needs room for the volume's full size there. The Prometheus volume hit
  # this on 2026-10-23 (Local Replica Scheduling Failure: insufficient storage) and was
  # patched live to dataLocality=disabled. Left as best-effort here because StorageClass
  # parameters are immutable; patch the Volume CR again if that PVC is ever recreated.
  dataLocality: "best-effort"
  staleReplicaTimeout: "30"
  fromBackup: ""
  fsType: "ext4"
  # "ignored" = follow the global remove-snapshots-during-filesystem-trim setting (false).
  # The Prometheus volume overrides this per volume (enabled, patched live 2026-10-23) -
  # see storage/longhorn/README.md "Backup snapshots keep deleted blocks". Left as-is here
  # because StorageClass parameters are immutable: changing them would make Flux fail to
  # apply this object until it's deleted and recreated.
  unmapMarkSnapChainRemoved: "ignored"
  disableRevisionCounter: "true"
  dataEngine: "v1"
  backupTargetName: "default"
