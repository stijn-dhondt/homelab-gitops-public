apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webtop
  namespace: jumphost
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    # KasmVNC's web client is a long-lived WebSocket stream, same reasoning as Hubble
    # UI's ingress.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Forward-auth via Authentik - see clusters/talos-dev/apps/authentik/README.md
    # ("How apps get protected"). Unlike the other 6 apps, this one uses its own
    # MFA-required authentication flow (see the jumphost README) rather than the
    # lenient default, since it's the one thing reachable from the public internet.
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://jump.example.com/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-proxy-set-headers: "jumphost/authentik-auth-headers"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - jump.example.com
      secretName: webtop-tls
  rules:
    - host: jump.example.com
      http:
        paths:
          # forward_single mode's OAuth-style callback happens on this app's own host -
          # see clusters/talos-dev/apps/authentik/README.md ("How apps get protected").
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webtop
                port:
                  number: 80
