apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webtop-egress
  namespace: jumphost
spec:
  podSelector:
    matchLabels:
      app: webtop
  policyTypes:
    - Egress
  egress:
    # DNS to the LAN's Pi-hole (see deployment.yaml's dnsConfig) - cluster CoreDNS is
    # deliberately not reachable, forcing DNS through the same path a real LAN client
    # uses instead of resolving cluster-internal service names.
    - to:
        - ipBlock:
            cidr: 10.0.10.12/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Everything else EXCEPT the cluster's own pod and Service networks - this is the
    # actual point of this policy: this container is meant to be a browser reaching the
    # internal apps (via the 10.0.40.0/24 ingress VIP range, like a real LAN client)
    # and the general internet, but if it's ever compromised, it should not be able to
    # reach other pods or Services directly (databases, kube-apiserver, etc.) - only
    # through the same authenticated ingress path everything else already goes through.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.244.0.0/16 # cluster pod network
              - 10.96.0.0/12 # cluster Service network (includes kube-apiserver)
