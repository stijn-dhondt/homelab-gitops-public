apiVersion: v1
kind: Service
metadata:
  name: mariadb-mcp
  namespace: wordpress
  annotations:
    # Raw TCP protocol (MySQL wire protocol) - ingress-nginx can't bypass-proxy this the way it
    # does for Grafana/n8n's HTTP APIs, hence a dedicated LoadBalancer instead of an Ingress. Only
    # reachable via the mcp_readonly user (see docs/claude-code-mcp.md) - real database auth is
    # the only gate here, no Authentik/network-level auth in front of it.
spec:
  type: LoadBalancer
  loadBalancerIP: "10.0.40.102"
  selector:
    app.kubernetes.io/component: primary
    app.kubernetes.io/instance: wordpress
    app.kubernetes.io/name: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
