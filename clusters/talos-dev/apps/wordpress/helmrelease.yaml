apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 5m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: wordpress
      version: "33.0.8"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    existingSecret: wordpress-credentials

    # RollingUpdate can't attach the RWO PVC to a surge pod while the old
    # pod still holds it, so upgrades stall with a Multi-Attach error.
    updateStrategy:
      type: Recreate

    persistence:
      storageClass: longhorn
      size: 4Gi

    service:
      type: ClusterIP

    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: example.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      tls: true

    mariadb:
      enabled: true
      auth:
        existingSecret: wordpress-mariadb-credentials
      primary:
        persistence:
          storageClass: longhorn
          size: 4Gi
      metrics:
        enabled: true
        # Enables the "Process States" / "Top Process States Hourly" panels on
        # the MySQL Overview Grafana dashboard (mysql_info_schema_threads is
        # otherwise never exported).
        extraArgs:
          primary:
            - --collect.info_schema.processlist
        serviceMonitor:
          enabled: true
          selector:
            app.kubernetes.io/component: primary
