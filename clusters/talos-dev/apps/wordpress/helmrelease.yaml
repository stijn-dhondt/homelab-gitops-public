apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 5m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: wordpress
      version: "34.2.6"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    existingSecret: wordpress-credentials

    # The chart defaults to bitnami/wordpress:latest with pullPolicy IfNotPresent,
    # so a node that already cached an older "latest" keeps serving it. Pin the
    # digest so the image only changes through git. This one ships PHP 8.4.27
    # (fixes CVE-2026-109618 / CVE-2026-109619, 2026-10-21 PHP security release).
    image:
      digest: "sha256:7366e2de7a0db585cbff6c410d56d85531c339d5adfb1845c0019bea4343ef87"

    # RollingUpdate can't attach the RWO PVC to a surge pod while the old
    # pod still holds it, so upgrades stall with a Multi-Attach error.
    updateStrategy:
      type: Recreate

    customHTAccessCM: wordpress-security-headers

    persistence:
      storageClass: longhorn
      size: 4Gi

    service:
      type: ClusterIP

    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: example.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      tls: true

    mariadb:
      enabled: true
      # Same stale-"latest" problem as the WordPress image above, and Bitnami only
      # publishes free images as "latest". Pin the digest so upgrades arrive as
      # Renovate PRs; the tag is only there for Renovate to look up new digests.
      image:
        # renovate: datasource=docker depName=docker.io/bitnami/mariadb
        tag: "latest"
        digest: "sha256:687181819d6e3f04124a21aec1aeef1d8a5d6a924c0d8e8f0cf66b8f0ce15a7c"
      auth:
        existingSecret: wordpress-mariadb-credentials
      primary:
        persistence:
          storageClass: longhorn
          size: 4Gi
      metrics:
        enabled: true
        image:
          # renovate: datasource=docker depName=docker.io/bitnami/mysqld-exporter
          tag: "latest"
          digest: "sha256:44e991d8a4fb886e74da42e40d380117e4f63d48bd1c46d77ead976c188bbadc"
        # Enables the "Process States" / "Top Process States Hourly" panels on
        # the MySQL Overview Grafana dashboard (mysql_info_schema_threads is
        # otherwise never exported).
        extraArgs:
          primary:
            - --collect.info_schema.processlist
        # Default 150m CPU limit was firing CPUThrottlingHigh (info) at 30-50%
        # throttled periods despite ~5m average usage - the exporter's scrape
        # bursts blow through the tiny 15ms/100ms CFS quota even though it barely
        # uses any CPU on average. Bumped to see if this was just too tight.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 192Mi
        serviceMonitor:
          enabled: true
          selector:
            app.kubernetes.io/component: primary
