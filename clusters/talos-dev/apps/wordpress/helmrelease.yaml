apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wordpress
  namespace: wordpress
spec:
  interval: 5m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: wordpress
      version: "34.2.0"
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    existingSecret: wordpress-credentials

    # The chart defaults to bitnami/wordpress:latest with pullPolicy IfNotPresent,
    # so a node that already cached an older "latest" keeps serving it. Pin the
    # digest so the image only changes through git. This one ships PHP 8.4.27
    # (fixes CVE-2026-109618 / CVE-2026-109619, 2026-10-21 PHP security release).
    image:
      digest: "sha256:7366e2de7a0db585cbff6c410d56d85531c339d5adfb1845c0019bea4343ef87"

    # RollingUpdate can't attach the RWO PVC to a surge pod while the old
    # pod still holds it, so upgrades stall with a Multi-Attach error.
    updateStrategy:
      type: Recreate

    customHTAccessCM: wordpress-security-headers

    persistence:
      storageClass: longhorn
      size: 4Gi

    service:
      type: ClusterIP

    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: example.com
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      tls: true

    mariadb:
      enabled: true
      auth:
        existingSecret: wordpress-mariadb-credentials
      primary:
        persistence:
          storageClass: longhorn
          size: 4Gi
      metrics:
        enabled: true
        # Enables the "Process States" / "Top Process States Hourly" panels on
        # the MySQL Overview Grafana dashboard (mysql_info_schema_threads is
        # otherwise never exported).
        extraArgs:
          primary:
            - --collect.info_schema.processlist
        # Default 150m CPU limit was firing CPUThrottlingHigh (info) at 30-50%
        # throttled periods despite ~5m average usage - the exporter's scrape
        # bursts blow through the tiny 15ms/100ms CFS quota even though it barely
        # uses any CPU on average. Bumped to see if this was just too tight.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 192Mi
        serviceMonitor:
          enabled: true
          selector:
            app.kubernetes.io/component: primary
