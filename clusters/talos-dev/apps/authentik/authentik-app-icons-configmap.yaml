# Application icons, self-hosted instead of linked from external CDNs (dashboard-icons,
# Simple Icons) - avoids depending on those being reachable every time someone loads the
# Authentik app list. Mounted into the authentik-server Deployment at
# /media/public/application-icons/ (see helmrelease.yaml's server.volumes/volumeMounts),
# which is the exact path Authentik's signed media-file endpoint reads from - confirmed
# live (a bare relative meta_icon like "application-icons/grafana.svg" 404's until a
# real file exists at that path; server.volumes doesn't survive a pod restart on its
# own, but a ConfigMap-backed mount does, since it's reconstructed identically every
# time from this file, not from ephemeral container storage).
#
# Source SVGs, for provenance/updates:
#   grafana, prometheus, alertmanager, n8n, longhorn:
#     https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/<name>.svg
#   hubble (no dedicated icon in that set - using Cilium's, since Hubble is part of that project):
#     https://raw.githubusercontent.com/homarr-labs/dashboard-icons/main/svg/cilium.svg
#   jumphost (Ubuntu's logo - webtop's "ubuntu-xfce" flavor is Ubuntu-based):
#     https://cdn.simpleicons.org/ubuntu/E95420
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-app-icons
  namespace: authentik
