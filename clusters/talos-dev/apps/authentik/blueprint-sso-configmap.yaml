apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprint-sso
  namespace: authentik
data:
  sso.yaml: |
    # One Group + Provider + Application per protected app. Each provider is "forward auth
    # (single application)" mode, not "domain level" - that's what makes per-app group
    # membership possible. The 6 internal *.lab.example.com apps share cookie_domain:
    # lab.example.com, so the underlying Authentik login session is shared (SSO) between them -
    # only the per-app *authorization* check is separate. The jumphost (the one app reachable
    # from the public internet) is deliberately its own cookie_domain and its own stricter
    # MFA-required authentication flow instead - see its README. To grant/revoke access to a
    # specific app, add/remove the user from its Group (Directory > Groups in the UI, or the
    # group's `users` list here).
    #
    # akadmin is a member of every group below so existing access isn't broken by this file.
    # Confirmed live before being written down: is_superuser does NOT bypass these bindings -
    # akadmin failed check_access on a group-bound test app until added to the group.
    #
    # This mirrors what was verified by hand against the live API first (see the authentik
    # README's "API access" section) - state: present means re-applying this is a no-op against
    # objects that already exist.
    version: 1
    metadata:
      name: Homelab - Per-app forward auth
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: Grafana Users
        id: group-grafana
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: Prometheus Users
        id: group-prometheus
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: Alertmanager Users
        id: group-alertmanager
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: n8n Users
        id: group-n8n
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: Longhorn UI Users
        id: group-longhorn
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: Hubble UI Users
        id: group-hubble
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]
      - model: authentik_core.group
        state: present
        identifiers:
          name: Jumphost Users
        id: group-jumphost
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      # Bound to every application below as a second, parallel policy binding (each
      # app's policy_engine_mode: any means either this group OR the app-specific one
      # grants access) - a quick way to give one test user every app at once, without
      # touching the per-app groups.
      - model: authentik_core.group
        state: present
        identifiers:
          name: All Apps Users
        id: group-all-apps
        attrs:
          users:
            - !Find [authentik_core.user, [username, akadmin]]

      # The jumphost is the one app reachable from the public internet (see its
      # README), so it gets its own stricter login flow requiring MFA - not the
      # lenient default the other 6 apps use, which skips MFA if the user has no
      # device enrolled.
      - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
        state: present
        identifiers:
          name: jumphost-mfa-required
        id: stage-jumphost-mfa
        attrs:
          not_configured_action: configure
          device_classes: [totp, static, webauthn]
          configuration_stages:
            - !Find [authentik_stages_authenticator_totp.authenticatortotpstage, [name, default-authenticator-totp-setup]]

      - model: authentik_flows.flow
        state: present
        identifiers:
          slug: jumphost-authentication-flow
        id: flow-jumphost-auth
        attrs:
          name: Jumphost Authentication (MFA required)
          title: Welcome to the Homelab Jumphost
          designation: authentication

      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf flow-jumphost-auth
          stage: !Find [authentik_stages_identification.identificationstage, [name, default-authentication-identification]]
        attrs:
          order: 0
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf flow-jumphost-auth
          stage: !Find [authentik_stages_password.passwordstage, [name, default-authentication-password]]
        attrs:
          order: 10
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf flow-jumphost-auth
          stage: !KeyOf stage-jumphost-mfa
        attrs:
          order: 20
      - model: authentik_flows.flowstagebinding
        state: present
        identifiers:
          target: !KeyOf flow-jumphost-auth
          stage: !Find [authentik_stages_user_login.userloginstage, [name, default-authentication-login]]
        attrs:
          order: 30

      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Grafana forward auth
        id: provider-grafana
        attrs:
          mode: forward_single
          external_host: https://grafana.lab.example.com
          cookie_domain: lab.example.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Prometheus forward auth
        id: provider-prometheus
        attrs:
          mode: forward_single
          external_host: https://prometheus.lab.example.com
          cookie_domain: lab.example.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Alertmanager forward auth
        id: provider-alertmanager
        attrs:
          mode: forward_single
          external_host: https://alertmanager.lab.example.com
          cookie_domain: lab.example.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: n8n forward auth
        id: provider-n8n
        attrs:
          mode: forward_single
          external_host: https://n8n.lab.example.com
          cookie_domain: lab.example.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Longhorn UI forward auth
        id: provider-longhorn
        attrs:
          mode: forward_single
          external_host: https://longhorn.lab.example.com
          cookie_domain: lab.example.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Hubble UI forward auth
        id: provider-hubble
        attrs:
          mode: forward_single
          external_host: https://hubble.lab.example.com
          cookie_domain: lab.example.com
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      - model: authentik_providers_proxy.proxyprovider
        state: present
        identifiers:
          name: Jumphost forward auth
        id: provider-jumphost
        attrs:
          mode: forward_single
          external_host: https://jump.example.com
          # Deliberately its own cookie_domain, not lab.example.com - this app isn't
          # part of the *.lab.example.com SSO domain, it's reached separately from the
          # public internet.
          cookie_domain: jump.example.com
          # The stricter MFA-required flow from above, not the shared lenient default.
          authentication_flow: !KeyOf flow-jumphost-auth
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: grafana
        id: app-grafana
        attrs:
          name: Grafana
          provider: !KeyOf provider-grafana
          meta_launch_url: https://grafana.lab.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          meta_icon: application-icons/grafana.svg
      - model: authentik_core.application
        state: present
        identifiers:
          slug: prometheus
        id: app-prometheus
        attrs:
          name: Prometheus
          provider: !KeyOf provider-prometheus
          meta_launch_url: https://prometheus.lab.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          meta_icon: application-icons/prometheus.svg
      - model: authentik_core.application
        state: present
        identifiers:
          slug: alertmanager
        id: app-alertmanager
        attrs:
          name: Alertmanager
          provider: !KeyOf provider-alertmanager
          meta_launch_url: https://alertmanager.lab.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          meta_icon: application-icons/alertmanager.svg
      - model: authentik_core.application
        state: present
        identifiers:
          slug: n8n
        id: app-n8n
        attrs:
          name: n8n
          provider: !KeyOf provider-n8n
          meta_launch_url: https://n8n.lab.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          meta_icon: application-icons/n8n.svg
      - model: authentik_core.application
        state: present
        identifiers:
          slug: longhorn
        id: app-longhorn
        attrs:
          name: Longhorn UI
          provider: !KeyOf provider-longhorn
          meta_launch_url: https://longhorn.lab.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          meta_icon: application-icons/longhorn.svg
      - model: authentik_core.application
        state: present
        identifiers:
          slug: hubble
        id: app-hubble
        attrs:
          name: Hubble UI
          provider: !KeyOf provider-hubble
          meta_launch_url: https://hubble.lab.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          # Cilium's icon, not a dedicated "hubble" one - see
          # authentik-app-icons-configmap.yaml's header comment for provenance.
          meta_icon: application-icons/hubble.svg
      - model: authentik_core.application
        state: present
        identifiers:
          slug: jumphost
        id: app-jumphost
        attrs:
          name: Jumphost
          provider: !KeyOf provider-jumphost
          meta_launch_url: https://jump.example.com
          policy_engine_mode: any
          open_in_new_tab: true
          # Ubuntu's logo - see authentik-app-icons-configmap.yaml's header comment
          # for provenance.
          meta_icon: application-icons/jumphost.svg

      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-grafana
          group: !KeyOf group-grafana
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-prometheus
          group: !KeyOf group-prometheus
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-alertmanager
          group: !KeyOf group-alertmanager
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-n8n
          group: !KeyOf group-n8n
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-longhorn
          group: !KeyOf group-longhorn
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-hubble
          group: !KeyOf group-hubble
        attrs:
          order: 0
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-jumphost
          group: !KeyOf group-jumphost
        attrs:
          order: 0
          enabled: true

      # "All Apps Users" bound to every application too, alongside its own specific
      # group above (policy_engine_mode: any means either one grants access).
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-grafana
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-prometheus
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-alertmanager
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-n8n
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-longhorn
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-hubble
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true
      - model: authentik_policies.policybinding
        state: present
        identifiers:
          target: !KeyOf app-jumphost
          group: !KeyOf group-all-apps
        attrs:
          order: 1
          enabled: true

      - model: authentik_outposts.outpost
        state: present
        identifiers:
          managed: goauthentik.io/outposts/embedded
        attrs:
          providers:
            - !KeyOf provider-grafana
            - !KeyOf provider-prometheus
            - !KeyOf provider-alertmanager
            - !KeyOf provider-n8n
            - !KeyOf provider-longhorn
            - !KeyOf provider-hubble
            - !KeyOf provider-jumphost
