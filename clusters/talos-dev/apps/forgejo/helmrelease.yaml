apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 5m
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  chart:
    spec:
      chart: forgejo
      version: "17.1.5"
      sourceRef:
        kind: HelmRepository
        name: forgejo
        namespace: flux-system

  values:
    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

    # No database section - leaving it unset keeps the chart's own default (embedded
    # SQLite), same reasoning as n8n: single-user homelab use doesn't need a separate
    # Postgres subchart/credentials like Authentik's.

    # Deliberately no Authentik forward-auth here, unlike every other *.lab.example.com
    # app - see the README's "Why no SSO" section. Forgejo keeps its own built-in auth
    # (users, tokens, SSH keys); git clone/push over HTTPS need to keep working from a
    # plain command-line client with no browser session cookie.
    gitea:
      admin:
        existingSecret: forgejo-admin-credentials
      config:
        server:
          DOMAIN: forgejo.lab.example.com
          ROOT_URL: https://forgejo.lab.example.com/

    ingress:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      hosts:
        - host: forgejo.lab.example.com
          paths:
            - path: /
              pathType: Prefix
              port: http
      tls:
        - hosts:
            - forgejo.lab.example.com
          secretName: forgejo-tls
