apiVersion: v1
kind: Service
metadata:
  name: authentik-outpost
  namespace: n8n
spec:
  # An Ingress can only reference Services in its own namespace - n8n is in the `n8n`
  # namespace, but Authentik's outpost is in `authentik`. This ExternalName Service is a
  # DNS alias so authentik-outpost-ingress.yaml (the /outpost.goauthentik.io callback
  # path - see the authentik README's "How apps get protected") can reach it.
  type: ExternalName
  externalName: authentik-server.authentik.svc.cluster.local
  ports:
    - port: 80
