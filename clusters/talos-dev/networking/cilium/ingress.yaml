apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Forward-auth via Authentik's shared domain-level provider - see
    # clusters/talos-dev/apps/authentik/README.md ("How apps get protected").
    nginx.ingress.kubernetes.io/auth-url: "http://authentik-server.authentik.svc.cluster.local/outpost.goauthentik.io/auth/nginx"
    nginx.ingress.kubernetes.io/auth-signin: "https://hubble.lab.example.com/outpost.goauthentik.io/start?rd=$scheme://$http_host$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: "Set-Cookie,X-authentik-username,X-authentik-groups,X-authentik-entitlements,X-authentik-email,X-authentik-name,X-authentik-uid"
    nginx.ingress.kubernetes.io/auth-proxy-set-headers: "kube-system/authentik-auth-headers"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hubble.lab.example.com
      secretName: hubble-ui-tls
  rules:
    - host: hubble.lab.example.com
      http:
        paths:
          # forward_single mode's OAuth-style callback happens on the app's own host
          # (hubble.lab.example.com), not authentik.lab.example.com - this path has to
          # reach Authentik's outpost, not Hubble UI itself, or the callback 404s.
          - path: /outpost.goauthentik.io
            pathType: Prefix
            backend:
              service:
                name: authentik-outpost
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hubble-ui
                port:
                  number: 80
