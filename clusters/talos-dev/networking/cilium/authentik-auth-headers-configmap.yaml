apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-auth-headers
  namespace: kube-system
data:
  # See clusters/talos-dev/monitoring/kube-prometheus-stack/authentik-auth-headers-configmap.yaml
  # for why this exists - identical content, just duplicated per namespace since
  # ingress-nginx doesn't allow cross-namespace ConfigMap references here.
  X-Forwarded-Host: "$http_host"
  X-Forwarded-Proto: "https"
