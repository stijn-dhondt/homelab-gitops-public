apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  timeout: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system

  values:
    crds:
      enabled: true
    replicaCount: 2
    webhook:
      replicaCount: 2
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
